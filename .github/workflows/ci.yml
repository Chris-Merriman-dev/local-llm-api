name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.8'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We install the core requirements plus the testing tools
        pip install fastapi uvicorn httpx pytest psutil pydantic flake8 black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Tests
      run: |
        # We tell pytest to run, it will find test_main.py automatically
        pytest

    - name: Lint code
      run: flake8 .

    - name: Format code
      #run: black . --check
      run: black .